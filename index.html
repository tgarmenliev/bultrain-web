<!doctype html>
<html lang="bg" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Theme: saved choice > system preference > dark. Runs before first paint (no flash). */
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('bultrain-theme');
          t = saved === 'light' || saved === 'dark' ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
