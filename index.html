<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Theme: saved choice > system preference > dark. Runs before first paint (no flash). */
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('bultrain-theme');
          t = saved === 'light' || saved === 'dark' ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="icon" type="image/png" href="/assets/logo-no-bg.png" />
